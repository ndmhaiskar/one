<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive size</title>
    <style>
        @media (min-width:700px){
            body {
                background-color: lightgreen;
            }
        }
        @media (max-width:699px){
            body{
                background-color: yellow;
            }
        }
    </style>
</head>
<body>
    <p>
        --HTML5 Organization (Converted into html tags)


        Responsive Design:
        Webpage must be responsive to user input and devices
        mobile,tabs,different screens, different os, different browsers
        --viewport
        --media queries
        --flexbox
        --grids

    </p>
</body>
</html>
